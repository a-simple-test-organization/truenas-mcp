[project]
name = "truenas-mcp"
version = "0.2.3"
description = "Read-only MCP server for TrueNAS Scale — k3s debugging and system introspection"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
truenas-mcp = "truenas_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["deploy", "deploy.*", "tests", "tests.*"]
