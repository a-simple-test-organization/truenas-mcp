[project]
name = "truenas-mcp"
version = "0.4.1"
description = "Read-only MCP server for TrueNAS SCALE 25.04.2.6 (Fangtooth) — Debian 13 Trixie, Docker + Incus + QEMU/KVM introspection"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
truenas-mcp = "truenas_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["deploy", "deploy.*", "tests", "tests.*"]
